name: image

# Publishes to GHCR. Three triggers, because they serve different needs:
#   - a version tag cuts the released image
#   - a push to main keeps :main current
#   - manual dispatch builds an ad-hoc tag, which is what the sizing sweep uses
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. bench)"
        required: false
        default: "bench"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One file is the source of truth for the version, so the image tag, the
      # binary's -X main.Version and the release all agree rather than drifting
      # into three answers. Bump it with `make bump V=x.y.z`.
      - id: version
        name: Read VERSION
        run: echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Three kinds of tag, doing three different jobs:
          #
          #   sha-<short>   immutable. The only one that always names exactly
          #                 one build, and therefore the only one safe to pin a
          #                 deployment to when it matters which bytes run.
          #   <version>     from the VERSION file. Moves on every push to main
          #                 until VERSION is bumped, so it names a release line
          #                 rather than a build.
          #   latest        the default branch's newest build. Convenience only.
          #
          # `latest` is gated on the default branch: without that, a build from
          # any feature branch would claim it, and the tag would silently mean
          # "whichever branch was pushed last".
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # amd64 only. The sqlite driver needs cgo, and cross-building it under
          # QEMU for arm64 is slow and fragile; the cluster this runs on is amd64.
          # Add arm64 with a native runner if that changes — not with emulation.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The package is private until made public in the repository's" >> "$GITHUB_STEP_SUMMARY"
          echo "package settings. A private package needs an imagePullSecret" >> "$GITHUB_STEP_SUMMARY"
          echo "in the cluster before anything can pull it." >> "$GITHUB_STEP_SUMMARY"
